[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragtorch"
version = "0.5.0"
description = "A modular, provider-independent execution kernel for building composable RAG systems."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ragtorch contributors" }]
keywords = ["rag", "retrieval-augmented-generation", "framework", "execution-kernel", "composability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/payamfirouzfar/RAG-MODULE"
Repository = "https://github.com/payamfirouzfar/RAG-MODULE"
Issues = "https://github.com/payamfirouzfar/RAG-MODULE/issues"
Changelog = "https://github.com/payamfirouzfar/RAG-MODULE/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragtorch"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist (defense in depth, on top of .gitignore): only
# what a source distribution actually needs to build/verify the
# package, never local development tooling directories.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not packaging\""
markers = [
    "packaging: builds a wheel/sdist and installs it into a fresh venv; slow, excluded by default, run explicitly with -m packaging",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ragtorch"]
