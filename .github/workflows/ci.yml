name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit and integration tests
        run: pytest --cov=ragtorch --cov-report=term-missing

      - name: Evaluation smoke test
        run: |
          python -c "
          from ragtorch.evaluation import EvaluationCase, Evaluator, ExactMatch
          cases = [EvaluationCase(input=1, expected=1), EvaluationCase(input=2, expected=2)]
          result = Evaluator([ExactMatch()]).evaluate(lambda x: x, cases)
          assert result.case_count == 2 and result.error_count == 0 and result.mean('exact_match') == 1.0, result.to_dict()
          "

      - name: Step 5 performance benchmark
        run: python benchmarks/step5_event_context_overhead.py | tee step5_event_context_overhead.txt

      - name: Upload Step 5 benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: step5-event-context-overhead-py${{ matrix.python-version }}
          path: step5_event_context_overhead.txt

      - name: Step 18 performance benchmark
        run: python benchmarks/step18_execution_scoped_events.py | tee step18_execution_scoped_events.txt

      - name: Upload Step 18 benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: step18-execution-scoped-events-benchmark-py${{ matrix.python-version }}
          path: step18_execution_scoped_events.txt

      - name: Build package
        run: pip install build && python -m build

  packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build + test tooling only (no editable install)
        run: pip install build pytest "tomli>=2.0; python_version < '3.11'"

      - name: Build wheel and sdist
        run: python -m build --outdir dist .

      - name: Inspect built artifacts
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          assert not any(n.startswith('tests/') for n in names), 'wheel must not contain tests'
          assert not any('.claude' in n for n in names), 'wheel must not contain local dev tooling'
          assert not any('__pycache__' in n for n in names), 'wheel must not contain bytecode caches'
          print(f'wheel contains {len(names)} entries, all checks passed')
          "

      - name: Clean-install the built wheel into a fresh environment
        run: |
          python -m venv /tmp/clean-install-env
          /tmp/clean-install-env/bin/python -m pip install --quiet dist/*.whl

      - name: Import ragtorch from the clean install (not the source checkout)
        run: |
          cd /tmp
          /tmp/clean-install-env/bin/python -c "
          import ragtorch
          print('version:', ragtorch.__version__)
          assert 'site-packages' in ragtorch.__file__
          "

      - name: Import documented public API from the clean install
        run: |
          cd /tmp
          /tmp/clean-install-env/bin/python -c "
          import ragtorch
          names = sorted(ragtorch.__all__)
          names.remove('__version__')
          exec('from ragtorch import ' + ', '.join(names))
          print(len(names), 'public exports imported successfully')
          "

      - name: Consumer smoke test against the clean install
        run: |
          cd /tmp
          /tmp/clean-install-env/bin/python -c "
          from ragtorch import Module, Sequential

          class UpperCase(Module):
              def forward(self, input):
                  return input.upper()

          class Reverse(Module):
              def forward(self, input):
                  return input[::-1]

          pipeline = Sequential(UpperCase(), Reverse())
          result = pipeline('hello')
          assert result == 'OLLEH', result
          print('consumer smoke test passed')
          "

      - name: Run the full packaging test suite (builds/installs its own artifacts)
        run: pytest -q -m packaging tests/packaging/

      - name: Upload built distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragtorch-dist-py${{ matrix.python-version }}
          path: dist/

  rag-consumer-demo:
    # Tests the examples/rag_consumer/ application (an external consumer
    # of the published ragmodel package) -- NOT part of ragtorch itself,
    # never affects ragtorch's own test/packaging jobs above. Uses only
    # HashingEmbedder/InMemoryVectorStore (no sentence-transformers/
    # faiss/GPU download) and mocks the OpenAI provider -- no API keys,
    # no live websites, no paid services. This is a smoke/unit test job,
    # not the real Colab notebook -- that remains a manual integration
    # demonstration, deliberately not run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ragmodel from PyPI plus demo dependencies (no GPU/model deps)
        run: |
          cd examples/rag_consumer
          pip install ragmodel==0.5.0 requests beautifulsoup4 openai pytest

      - name: Run rag_consumer demo test suite (mocked network/LLM, no API keys)
        run: |
          cd examples/rag_consumer
          pytest -q

      - name: Run rag_consumer demo benchmark (HashingEmbedder, no model download)
        run: |
          cd examples/rag_consumer
          python benchmark.py
